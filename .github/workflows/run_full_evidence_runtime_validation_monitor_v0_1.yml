name: Run Full Evidence Runtime Validation Monitor v0.1

on:
  push:
    paths:
      - 'Research/runtime/full_evidence_runtime_log_v0_1.jsonl'
      - 'Research/full_evidence_runtime_validation_monitor_v0_1.py'
      - 'Backup/AI_MARKET_MASTER_3.2_FULL_EVIDENCE_RUNTIME_VALIDATION_PROTOCOL_v0.2_FREEZE.md'
      - '.github/workflows/run_full_evidence_runtime_validation_monitor_v0_1.yml'
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-evidence-runtime-validation-monitor-v0-1
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Protocol v0.2 progress report
        run: python Research/full_evidence_runtime_validation_monitor_v0_1.py
      - name: Commit monitor projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/results/full_evidence_runtime_validation_monitor_v0_1.json Research/results/full_evidence_runtime_validation_monitor_v0_1.md
          if git diff --cached --quiet; then
            echo 'No monitor changes'
          else
            git commit -m 'research: update Full Evidence validation monitor'
            git push
          fi
