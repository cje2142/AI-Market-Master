name: Run Dashboard Candidate Runtime Adapter v1.0 Tests

on:
  push:
    paths:
      - 'Research/dashboard_candidate_runtime_adapter_v1_0.py'
      - 'Research/process_dashboard_candidate_runtime_inbox_v1_0.py'
      - 'Research/test_dashboard_candidate_runtime_adapter_v1_0.py'
      - 'Research/full_evidence_candidate_evaluator_v1_0.py'
      - 'Research/full_evidence_candidate_input_contract_v1_0.py'
      - 'Research/full_evidence_candidate_transition_engine_v1_0.py'
      - 'Research/full_evidence_candidate_risk_budget_connector_v1_0.py'
      - 'Research/risk_budget_execution_v0_1.py'
      - 'Research/full_evidence_runtime_log_v0_1.py'
      - '.github/workflows/run_dashboard_candidate_runtime_adapter_v1_0_tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic Step 6 tests
        run: |
          cd Research
          python test_dashboard_candidate_runtime_adapter_v1_0.py
      - name: Commit reproducible test results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/results/dashboard_candidate_runtime_adapter_v1_0_test_results.md Research/results/dashboard_candidate_runtime_adapter_v1_0_test_results.json
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'research: run Step 6 Dashboard Candidate runtime tests'
            git push
          fi
