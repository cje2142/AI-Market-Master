name: Run Full Evidence Runtime Log v0.1 Tests

on:
  push:
    paths:
      - '.github/workflows/run_full_evidence_runtime_log_v0_1_tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic runtime-log tests
        run: |
          cd Research
          python test_full_evidence_runtime_log_v0_1.py
      - name: Commit reproducible results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/results/full_evidence_runtime_log_v0_1_test_results.md Research/results/full_evidence_runtime_log_v0_1_test_results.json
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'research: run Full Evidence runtime log v0.1 tests'
            git push
          fi
