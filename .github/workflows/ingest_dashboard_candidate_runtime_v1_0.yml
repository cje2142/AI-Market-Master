name: Ingest Dashboard Candidate Runtime v1.0

on:
  push:
    paths:
      - 'Research/runtime/candidate_inbox/*.json'

permissions:
  contents: write

concurrency:
  group: full-evidence-runtime-log-v0-1
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate Candidate v1.0 and ingest Runtime Log
        run: python Research/process_dashboard_candidate_runtime_inbox_v1_0.py
      - name: Commit canonical Runtime Log and CSV projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/runtime/full_evidence_runtime_log_v0_1.jsonl Research/runtime/full_evidence_runtime_log_v0_1.csv
          if git diff --cached --quiet; then
            echo 'No new Candidate prospective sample (duplicate or no-op)'
          else
            git commit -m 'runtime: append Candidate v1.0 prospective Dashboard sample'
            git push
          fi
