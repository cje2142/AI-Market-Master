name: Run Dashboard Runtime Logger Adapter v0.1 Tests

on:
  push:
    paths:
      - 'Research/dashboard_runtime_logger_adapter_v0_1.py'
      - 'Research/risk_budget_execution_v0_1.py'
      - 'Research/test_dashboard_runtime_logger_adapter_v0_1.py'
      - '.github/workflows/run_dashboard_runtime_logger_adapter_v0_1_tests.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Dashboard Runtime Logger Adapter deterministic tests
        run: |
          cd Research
          python test_dashboard_runtime_logger_adapter_v0_1.py
      - name: Commit reproducible results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Research/results/dashboard_runtime_logger_adapter_v0_1_test_results.json Research/results/dashboard_runtime_logger_adapter_v0_1_test_results.md
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'research: validate Dashboard Runtime Logger Adapter v0.1'
            git push
          fi
